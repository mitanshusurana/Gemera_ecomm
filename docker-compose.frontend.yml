services:
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      cache_from: []
    container_name: jewelry-frontend
    restart: always
    environment:
      # Change API_URL to point to the remote backend IP/domain
      API_URL: ${API_URL:-http://localhost:8080/api/v1}
      RAZORPAY_KEY: ${RAZORPAY_KEY:-}
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:-localhost,127.0.0.1}
      PORT: 4000
      NODE_ENV: production
    ports:
      - "4200:4000"
      - "80:4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s