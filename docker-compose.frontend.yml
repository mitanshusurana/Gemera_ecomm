version: '3.8'

# FRONTEND VM DEPLOYMENT
# Usage: docker compose -f docker-compose.frontend.yml up -d

services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/mitanshusurana/gemera_ecomm-frontend:latest}
    container_name: jewelry-frontend
    restart: always
    env_file:
      - .env.frontend
    ports:
      - "80:4000"
