# Caratloop ERP front end.
#
# Mounted by docker-compose.erp.yml as the only server block of erp-nginx.
#
# TLS is scaffolded but NOT yet active: the stack serves plain HTTP on port 80
# until certificates exist. See nginx/TLS.md. The ACME challenge location below
# is what lets certbot issue them without taking the site down.
#
# HSTS is deliberately absent from this HTTP block. It is meaningless over
# plain HTTP, and enabling it before renewal is proven would lock browsers out.
# It lives in tls/ssl.conf.example, to be turned on with the 443 listener.

# TLS server blocks live here. The directory is empty until certificates
# exist, and nginx tolerates an include that matches nothing -- so the stack
# starts on plain HTTP either way rather than crash-looping on a missing cert.
include /etc/nginx/conf.d/tls/*.conf;

upstream erp_backend {
    server erp-backend:8000;
}

upstream erp_frontend {
    server erp-frontend:3000;
}

# Blunt brute-force limiter on the login endpoint. The application has none.
limit_req_zone $binary_remote_addr zone=erp_login:10m rate=5r/m;

# nginx answers a throttled request with 503 by default, which says "this
# server is broken" -- the UI shows a generic outage and an automated client
# has no reason to back off rather than retry immediately. 429 is what "you are
# going too fast" means, and it is what clients and the login screen can act on.
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # Do not advertise the nginx version.
    server_tokens off;

    client_max_body_size 25m;

    # --- Security headers ------------------------------------------------
    # The admin nginx config (nginx-custom.conf) sets none of these.
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "DENY"               always;
    add_header Referrer-Policy           "same-origin"        always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"       always;
    # Enable once TLS terminates here:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The ERP is an internal back-office tool: keep it out of search indexes.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # --- API -------------------------------------------------------------
    location /api/v1/auth/login {
        limit_req zone=erp_login burst=3 nodelay;

        proxy_pass         http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass         http://erp_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Interactive API docs are disabled in the application when ENVIRONMENT is
    # production; blocked here too so a misconfiguration does not expose them.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # --- Application -----------------------------------------------------
    location / {
        proxy_pass         http://erp_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ACME http-01 challenge. Must stay on plain HTTP and must not redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
