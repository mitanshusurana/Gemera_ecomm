services:
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      cache_from: []
    container_name: jewelry-frontend
    restart: always
    environment:
      API_URL: ${API_URL:-https://api.gemera.com/api/v1}
      RAZORPAY_KEY: rzp_test_S5goGHXLEuP6hP
      NG_ALLOWED_HOSTS: localhost,127.0.0.1,129.159.18.63
      PORT: 4000
      NODE_ENV: production
    ports:
      - "80:4000"
      - "4200:4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
