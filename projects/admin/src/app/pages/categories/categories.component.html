<div class="max-w-7xl mx-auto space-y-6">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-semibold text-gray-900">Categories Management</h1>
    <button (click)="openAddCategoryModal()" class="bg-primary-600 text-white px-4 py-2 rounded shadow hover:bg-primary-700">
      Add Root Category
    </button>
  </div>

  <div class="bg-white shadow rounded-lg overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Display Name</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type Flags</th>
          <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <ng-container *ngFor="let cat of flattenedCategories()">
          <tr>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
              <div [style.paddingLeft.px]="cat.level * 20" class="flex items-center">
                <span *ngIf="cat.level > 0" class="mr-2 text-gray-400">↳</span>
                {{ cat.name }}
              </div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ cat.displayName }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
              <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                    [ngClass]="cat.isActive ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
                {{ cat.isActive ? 'Active' : 'Inactive' }}
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
              <div class="flex space-x-1 flex-wrap">
                <span *ngIf="cat.showJewelryFields" class="px-1.5 py-0.5 rounded bg-blue-100 text-blue-800 text-xs">Jewelry</span>
                <span *ngIf="cat.showGemstoneFields" class="px-1.5 py-0.5 rounded bg-purple-100 text-purple-800 text-xs">Gemstone</span>
                <span *ngIf="cat.showComponentFields" class="px-1.5 py-0.5 rounded bg-yellow-100 text-yellow-800 text-xs">Components</span>
                <span *ngIf="cat.showIdolFields" class="px-1.5 py-0.5 rounded bg-orange-100 text-orange-800 text-xs">Idols</span>
                <span *ngIf="cat.showRoughFields" class="px-1.5 py-0.5 rounded bg-gray-100 text-gray-800 text-xs">Roughs</span>
              </div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
              <button (click)="openAddCategoryModal(cat.id)" class="text-indigo-600 hover:text-indigo-900 mr-3">Add Sub</button>
              <button (click)="openEditCategoryModal(cat)" class="text-blue-600 hover:text-blue-900 mr-3">Edit</button>
              <button (click)="deleteCategory(cat.id)" class="text-red-600 hover:text-red-900">Delete</button>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div *ngIf="showModal()" class="fixed z-10 inset-0 overflow-y-auto">
  <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
    <div class="fixed inset-0 transition-opacity" aria-hidden="true" (click)="closeModal()">
      <div class="absolute inset-0 bg-gray-500 opacity-75"></div>
    </div>
    <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
    <div class="relative z-10 inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full" (click)="$event.stopPropagation()">
      <form [formGroup]="categoryForm" (ngSubmit)="saveCategory()">
        <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
          <div class="sm:flex sm:items-start">
            <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
              <h3 class="text-lg leading-6 font-medium text-gray-900">
                {{ isEditing() ? 'Edit Category' : 'Add Category' }}
              </h3>
              <div class="mt-4 space-y-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700">Name (System)</label>
                  <input type="text" formControlName="name" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700">Display Name (UI)</label>
                  <input type="text" formControlName="displayName" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
                </div>
                <div class="flex items-center">
                  <input type="checkbox" formControlName="isActive" class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded">
                  <label class="ml-2 block text-sm text-gray-900">Active</label>
                </div>
                <div class="space-y-2 border-t pt-2">
                  <span class="text-sm font-medium text-gray-700">UI Form Fields (Used in Admin & Frontend)</span>
                  <div class="grid grid-cols-2 gap-2">
                    <div class="flex items-center">
                      <input type="checkbox" formControlName="showJewelryFields" class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded">
                      <label class="ml-2 block text-sm text-gray-900">Jewelry Fields</label>
                    </div>
                    <div class="flex items-center">
                      <input type="checkbox" formControlName="showGemstoneFields" class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded">
                      <label class="ml-2 block text-sm text-gray-900">Gemstone Fields</label>
                    </div>
                    <div class="flex items-center">
                      <input type="checkbox" formControlName="showComponentFields" class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded">
                      <label class="ml-2 block text-sm text-gray-900">Component Fields</label>
                    </div>
                    <div class="flex items-center">
                      <input type="checkbox" formControlName="showIdolFields" class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded">
                      <label class="ml-2 block text-sm text-gray-900">Idol Fields</label>
                    </div>
                    <div class="flex items-center">
                      <input type="checkbox" formControlName="showRoughFields" class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded">
                      <label class="ml-2 block text-sm text-gray-900">Rough Fields</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
          <button type="submit" [disabled]="categoryForm.invalid" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-primary-600 text-base font-medium text-white hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 sm:ml-3 sm:w-auto sm:text-sm disabled:opacity-50">
            Save
          </button>
          <button type="button" (click)="closeModal()" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
