<div class="px-4 sm:px-6 lg:px-8">
  <div class="sm:flex sm:items-center">
    <div class="sm:flex-auto">
      <h1 class="text-xl font-semibold text-gray-900">Orders</h1>
      <p class="mt-2 text-sm text-gray-700">A list of all the orders in your store including their status and total.</p>
    </div>
  </div>
  <div class="mt-8 flex flex-col">
    <div class="-my-2 -mx-4 overflow-x-auto sm:-mx-6 lg:-mx-8">
      <div class="inline-block min-w-full py-2 align-middle md:px-6 lg:px-8">
        <div class="overflow-hidden shadow ring-1 ring-black ring-opacity-5 md:rounded-lg">
          <table class="min-w-full divide-y divide-gray-300">
            <thead class="bg-gray-50">
              <tr>
                <th scope="col" class="py-3.5 pl-4 pr-3 text-left text-sm font-semibold text-gray-900 sm:pl-6">Order ID</th>
                <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">Customer</th>
                <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">Total</th>
                <th scope="col" class="px-3 py-3.5 text-left text-sm font-semibold text-gray-900">Status</th>
                <th scope="col" class="relative py-3.5 pl-3 pr-4 sm:pr-6">
                  <span class="sr-only">View</span>
                </th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 bg-white">
              <tr *ngFor="let order of orders">
                <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-gray-900 sm:pl-6">{{ order.id }}</td>
                <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">{{ order.shippingAddress?.firstName }} {{ order.shippingAddress?.lastName }}</td>
                <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">{{ order.total | currency }}</td>
                <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
                  <span class="inline-flex rounded-full px-2 text-xs font-semibold leading-5"
                    [ngClass]="{
                      'bg-green-100 text-green-800': order.status === 'COMPLETED',
                      'bg-yellow-100 text-yellow-800': order.status === 'PENDING',
                      'bg-red-100 text-red-800': order.status === 'CANCELLED'
                    }">
                    {{ order.status }}
                  </span>
                </td>
                <td class="relative whitespace-nowrap py-4 pl-3 pr-4 text-right text-sm font-medium sm:pr-6">
                  <a [routerLink]="['/orders', order.id]" class="text-emerald-600 hover:text-emerald-900">View<span class="sr-only">, {{ order.id }}</span></a>
                </td>
              </tr>
              <tr *ngIf="orders.length === 0 && !loading">
                <td colspan="5" class="px-6 py-4 text-center text-sm text-gray-500">No orders found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
