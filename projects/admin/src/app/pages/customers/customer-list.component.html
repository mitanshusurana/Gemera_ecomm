<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden pb-24">
  <header class="flex items-center bg-surface dark:bg-surface border-b border-ink dark:border-ink p-4 sticky top-0 z-10 justify-between">
    <div class="flex items-center gap-3">
      <div class="text-primary flex size-10 items-center justify-center rounded-lg bg-primary/10">
        <span class="material-symbols-outlined">group</span>
      </div>
      <h2 class="text-ink dark:text-ink text-xl font-bold leading-tight tracking-tight">Customers</h2>
    </div>
    <div class="flex items-center gap-2">
      <button class="flex size-10 items-center justify-center rounded-full bg-primary text-surface">
        <span class="material-symbols-outlined">person_add</span>
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-3xl mx-auto w-full">
    <div class="px-4 py-4">
      <label class="flex flex-col min-w-40 h-12 w-full">
        <div class="flex w-full flex-1 items-stretch rounded-xl h-full shadow-sm border border-ink dark:border-ink bg-surface dark:bg-surface focus-within:ring-2 focus-within:ring-primary/20">
          <div class="text-ink flex items-center justify-center pl-4">
            <span class="material-symbols-outlined">search</span>
          </div>
          <input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-ink dark:text-ink focus:outline-0 focus:ring-0 border-none bg-transparent h-full placeholder:text-ink px-4 pl-2 text-base font-normal leading-normal" placeholder="Search by name, tier, or status..."/>
        </div>
      </label>
    </div>

    <div class="flex gap-3 px-4 pb-4 overflow-x-auto no-scrollbar">
      <button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-primary text-surface px-4 text-sm font-semibold">
        All Customers
      </button>
      <button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-surface dark:bg-surface border border-ink dark:border-ink px-4 text-sm font-medium text-ink dark:text-ink hover:bg-surface transition-colors">
        VIP
      </button>
      <button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-surface dark:bg-surface border border-ink dark:border-ink px-4 text-sm font-medium text-ink dark:text-ink hover:bg-surface transition-colors">
        Gold
      </button>
      <button class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-surface dark:bg-surface border border-ink dark:border-ink px-4 text-sm font-medium text-ink dark:text-ink hover:bg-surface transition-colors">
        Silver
      </button>
    </div>

    <div class="flex flex-col gap-4 px-4">
      <!-- Customer Cards -->
      <div *ngFor="let customer of customers" class="flex flex-col gap-4 bg-surface dark:bg-surface p-5 rounded-xl shadow-sm border border-ink dark:border-ink hover:shadow-md transition-shadow">
        <div class="flex justify-between items-start">
          <div class="flex items-start gap-4">
            <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-14 w-14 border-2 border-primary/20" [ngStyle]="{'background-image': 'url(' + customer.avatar + ')'}"></div>
            <div class="flex flex-col">
              <div class="flex items-center gap-2">
                <p class="text-ink dark:text-ink text-lg font-bold">{{ customer.name }}</p>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider"
                      [ngClass]="{
                        'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400': customer.tier === 'VIP',
                        'bg-surface text-ink dark:bg-surface dark:text-ink': customer.tier !== 'VIP'
                      }">
                  {{ customer.tier }}
                </span>
              </div>
              <p class="text-ink dark:text-ink text-sm">Last Active: {{ customer.lastActive }}</p>
            </div>
          </div>
          <div class="text-right">
            <p class="text-ink text-xs font-medium uppercase">Total Spend</p>
            <p class="text-primary text-lg font-bold">{{ customer.totalSpend | currency }}</p>
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <div class="flex justify-between items-end">
            <p class="text-ink dark:text-ink text-sm font-semibold">Treasure Plan</p>
            <p class="text-ink dark:text-ink text-xs">{{ customer.planProgress }}% Complete</p>
          </div>
          <div class="w-full bg-surface dark:bg-surface rounded-full h-2.5">
            <div class="bg-primary h-2.5 rounded-full" [ngStyle]="{'width': customer.planProgress + '%'}"></div>
          </div>
        </div>

        <div class="flex gap-3 pt-2">
          <button class="flex-1 flex items-center justify-center gap-2 bg-[#25D366] hover:bg-[#20bd5a] text-surface py-2.5 rounded-lg font-semibold text-sm transition-colors">
            <span class="material-symbols-outlined text-lg">chat</span>
            WhatsApp
          </button>
          <button class="flex-1 flex items-center justify-center gap-2 bg-surface dark:bg-surface hover:bg-surface dark:hover:bg-surface text-ink dark:text-ink py-2.5 rounded-lg font-semibold text-sm transition-colors">
            <span class="material-symbols-outlined text-lg">visibility</span>
            Profile
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
