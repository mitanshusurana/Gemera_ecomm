<div class="px-4 sm:px-6 lg:px-8 pb-12">
  <div class="sm:flex sm:items-center mb-6">
    <div class="sm:flex-auto">
      <h1 class="text-xl font-semibold text-ink">{{ isEditMode ? 'Edit Product' : 'Add Product' }}</h1>
    </div>
  </div>

  <!-- Wizard Progress Bar -->
  <nav aria-label="Progress" class="mb-8">
    <ol role="list" class="flex items-center">
      <li *ngFor="let step of [1, 2, 3, 4, 5, 6]; let i = index" [class.hidden]="step === 6 && selectedCategory !== 'Gemstones'" class="relative pr-8 sm:pr-20">
        <div class="absolute inset-0 flex items-center" aria-hidden="true">
          <div class="h-0.5 w-full" [ngClass]="currentStep > step ? 'bg-primary' : 'bg-gray-200'"></div>
        </div>
        <button type="button" (click)="goToStep(step)"
                class="relative flex h-8 w-8 items-center justify-center rounded-full"
                [ngClass]="currentStep === step ? 'bg-primary ring-2 ring-primary ring-offset-2' : (currentStep > step ? 'bg-primary' : 'bg-white border-2 border-gray-300')">
          <span *ngIf="currentStep > step" class="text-white">✓</span>
          <span *ngIf="currentStep <= step" [ngClass]="currentStep === step ? 'text-white font-bold' : 'text-gray-500'">{{ step }}</span>
        </button>
      </li>
    </ol>
  </nav>

  <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-6 bg-surface shadow sm:rounded-lg p-6">

    <!-- Step 1: Basic Information -->
    <div *ngIf="currentStep === 1">
      <h3 class="text-lg font-medium leading-6 text-ink mb-4">Step 1: Basic Information</h3>
      <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
        <div class="sm:col-span-6">
          <label class="block text-sm font-medium text-ink">Category *</label>
          <select formControlName="category" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
            <option value="">Select Category</option>
            <option *ngFor="let cat of categoriesList" [value]="cat.name">{{ cat.name }}</option>
          </select>
        </div>

        <div class="sm:col-span-3">
          <label class="block text-sm font-medium text-ink">Name *</label>
          <input type="text" formControlName="name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
        </div>

        <div class="sm:col-span-3">
          <label class="block text-sm font-medium text-ink">Price *</label>
          <input type="number" formControlName="price" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
        </div>

        <div class="sm:col-span-6">
          <label class="block text-sm font-medium text-ink">Description *</label>
          <textarea formControlName="description" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm"></textarea>
        </div>

        <div class="sm:col-span-3">
          <label class="block text-sm font-medium text-ink">Sub-Category</label>
          <select formControlName="subCategory" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
            <option value="">Select a sub-category</option>
            <option *ngFor="let sub of subCategoriesMap[selectedCategory]" [value]="sub">{{ sub }}</option>
          </select>
        </div>

        <div class="sm:col-span-3">
          <label class="block text-sm font-medium text-ink">Stock Quantity *</label>
          <input type="number" formControlName="stockQuantity" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
        </div>
      </div>
    </div>

    <!-- Step 2: Inventory & Verification -->
    <div *ngIf="currentStep === 2">
      <h3 class="text-lg font-medium leading-6 text-ink mb-4">Step 2: Inventory & Verification</h3>
      <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
        <div class="sm:col-span-3">
          <label class="block text-sm font-medium text-ink">Inventory Ownership</label>
          <select formControlName="inventoryOwnership" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
            <option value="Owned Stock">Owned Stock</option>
            <option value="Memo / Consignment">Memo / Consignment</option>
            <option value="Virtual / Vendor">Virtual / Vendor</option>
          </select>
        </div>

        <div class="sm:col-span-3 flex items-center">
          <div class="flex items-center h-5">
            <input formControlName="isVerified" type="checkbox" class="focus:ring-primary h-4 w-4 text-primary border-gray-300 rounded">
          </div>
          <div class="ml-3 text-sm">
            <label class="font-medium text-ink">Is Verified & Ready for Publication?</label>
          </div>
        </div>

        <div class="sm:col-span-6">
          <label class="block text-sm font-medium text-ink">SEO Qualifiers (Comma separated)</label>
          <input type="text" formControlName="seoQualifiersStr" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
        </div>
      </div>
    </div>

    <!-- Step 3: Media Uploads -->
    <div *ngIf="currentStep === 3">
      <h3 class="text-lg font-medium leading-6 text-ink mb-4">Step 3: Media Uploads</h3>
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-ink">Add Image Files</label>
          <input type="file" multiple (change)="onFileChange($event)" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-primary file:text-white hover:file:bg-primary-dark">
        </div>

        <div>
          <label class="block text-sm font-medium text-ink">Upload Video</label>
          <input type="file" accept="video/*" (change)="onVideoFileChange($event)" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-primary file:text-white hover:file:bg-primary-dark">
        </div>
      </div>
    </div>

    <!-- Step 4: Price Breakup -->
    <div *ngIf="currentStep === 4" formGroupName="priceBreakup">
      <h3 class="text-lg font-medium leading-6 text-ink mb-4">Step 4: Price Breakup</h3>
      <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
        <div class="sm:col-span-3">
          <label class="block text-sm font-medium text-ink">Metal Price</label>
          <input type="number" formControlName="metal" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
        </div>
        <div class="sm:col-span-3">
          <label class="block text-sm font-medium text-ink">Gemstone Price</label>
          <input type="number" formControlName="gemstone" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
        </div>
        <div class="sm:col-span-3">
          <label class="block text-sm font-medium text-ink">Making Charges</label>
          <input type="number" formControlName="makingCharges" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
        </div>
        <div class="sm:col-span-3">
          <label class="block text-sm font-medium text-ink">Tax</label>
          <input type="number" formControlName="tax" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
        </div>
      </div>
    </div>

    <!-- Step 5/6: Loose Gemstone Details -->
    <div *ngIf="currentStep === 5 && selectedCategory === 'Gemstones'">
      <h3 class="text-lg font-medium leading-6 text-ink mb-4">Step 5: Loose Gemstone Details</h3>
      <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
        <div class="sm:col-span-3">
          <label class="block text-sm font-medium text-ink">Stone SKU</label>
          <input type="text" formControlName="stoneSku" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
        </div>
        <div class="sm:col-span-3">
          <label class="block text-sm font-medium text-ink">Species</label>
          <select formControlName="species" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
            <option value="">Select Species</option>
            <option *ngFor="let s of species" [value]="s">{{ s }}</option>
          </select>
        </div>
        <div class="sm:col-span-3">
          <label class="block text-sm font-medium text-ink">Carat Weight</label>
          <input type="number" formControlName="caratWeight" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
        </div>
        <div class="sm:col-span-3">
          <label class="block text-sm font-medium text-ink">Clarity</label>
          <select formControlName="clarity" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm">
            <option value="">Select Clarity</option>
            <option *ngFor="let c of clarities" [value]="c">{{ c }}</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Final Step: Customization Options -->
    <div *ngIf="(currentStep === 5 && selectedCategory !== 'Gemstones') || currentStep === 6">
      <h3 class="text-lg font-medium leading-6 text-ink mb-4">Final Step: Customization Options</h3>
      <button type="button" (click)="addCustomizationOption()" class="mb-4 inline-flex items-center px-3 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-ink bg-white hover:bg-gray-50">
        Add Option
      </button>
      <div formArrayName="customizationOptions">
        <div *ngFor="let opt of customizationOptions.controls; let i=index" [formGroupName]="i" class="mb-4 p-4 border rounded">
          <div class="grid grid-cols-3 gap-4">
            <input formControlName="type" placeholder="Type (e.g. Size)" class="block w-full rounded-md border-gray-300 shadow-sm">
            <input formControlName="name" placeholder="Name (e.g. Medium)" class="block w-full rounded-md border-gray-300 shadow-sm">
            <input type="number" formControlName="priceModifier" placeholder="Price Modifier" class="block w-full rounded-md border-gray-300 shadow-sm">
          </div>
          <button type="button" (click)="removeCustomizationOption(i)" class="mt-2 text-red-600 text-sm">Remove</button>
        </div>
      </div>
    </div>

    <!-- Wizard Footer Actions -->
    <div class="mt-8 flex justify-between items-center border-t border-gray-200 pt-5">
      <button type="button" (click)="prevStep()" [disabled]="currentStep === 1" class="px-4 py-2 bg-gray-100 text-gray-700 border border-gray-300 rounded-md shadow-sm hover:bg-gray-200 disabled:opacity-50">
        Previous
      </button>
      <div class="flex space-x-3">
        <button type="button" *ngIf="currentStep < totalSteps" (click)="nextStep()" class="px-4 py-2 bg-primary text-white border border-transparent rounded-md shadow-sm hover:bg-primary-dark font-bold">
          Next
        </button>
        <button type="submit" *ngIf="currentStep === totalSteps" [disabled]="loading || uploadingMedia" class="px-4 py-2 bg-green-600 text-white border border-transparent rounded-md shadow-sm hover:bg-green-700 font-bold disabled:opacity-50">
          Save Product
        </button>
      </div>
    </div>

  </form>
</div>
