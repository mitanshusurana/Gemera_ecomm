services:
  postgres:
    image: postgres:15-alpine
    container_name: jewelry-postgres
    restart: always
    environment:
      POSTGRES_DB: jewelry_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jewelry-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jewelry_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-default-key}
      R2_SECRET_KEY: ${R2_SECRET_KEY:-default-secret}
      R2_ENDPOINT: ${R2_ENDPOINT:-https://default.r2.cloudflarestorage.com}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-jewelry-assets}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-https://pub-default.r2.dev}
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      # Ensure fresh build without Docker layer cache
      cache_from: []
    container_name: jewelry-frontend
    restart: always
    environment:
      API_URL: http://backend:8080/api/v1
      RAZORPAY_KEY: rzp_test_S5goGHXLEuP6hP
      NG_ALLOWED_HOSTS: localhost,127.0.0.1,129.159.18.63
      PORT: 4000
      NODE_ENV: production
    ports:
      - "80:4000"
      - "4200:4000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  admin:
    build:
      context: .
      dockerfile: admin.Dockerfile
    container_name: jewelry-admin
    restart: always
    environment:
      API_URL: http://localhost:8080/api/v1
    ports:
      - "4300:80"
    depends_on:
      - backend

volumes:
  postgres_data:
