name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            no-cache: false
          - name: frontend
            context: .
            file: ./frontend.Dockerfile
            # Fresh builds so the SSR manifest is always regenerated.
            no-cache: true
          - name: admin
            context: .
            file: ./admin.Dockerfile
            no-cache: false
          - name: erp-backend
            context: ./projects/erp-backend
            file: ./projects/erp-backend/Dockerfile
            no-cache: false
          - name: erp-frontend
            context: ./projects/erp-frontend
            file: ./projects/erp-frontend/Dockerfile
            no-cache: false

    steps:
      # GHCR requires a lower-case repository path.
      - name: Set lower case image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@v4

      # Buildx is needed for multi-architecture builds (e.g. an Oracle Ampere A1 VM).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (${{ matrix.name }})
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.name }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          no-cache: ${{ matrix.no-cache }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.name }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.name }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          # platforms: linux/amd64,linux/arm64
