app:
  cors:
    allowed-origins: ${NG_ALLOWED_HOSTS:http://localhost:4200,http://localhost:4300,http://129.159.18.63,http://129.159.18.63:8080}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  cart:
    tax-rate: ${CART_TAX_RATE:0.10}
    shipping-threshold: ${CART_SHIPPING_THRESHOLD:1000}
    standard-shipping-fee: ${CART_STANDARD_SHIPPING_FEE:50}
    gift-wrap-fee: ${CART_GIFT_WRAP_FEE:5}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}


spring:
  application:
    name: jewelry-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 86400000 # 24 hours
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  health:
    mail:
      enabled: false

goldapi:
  key: ${GOLDAPI_KEY}
  base-url: https://www.goldapi.io/api
  cache-minutes: 15

cloudflare:
  r2:
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    endpoint: ${R2_ENDPOINT}
    bucket: ${R2_BUCKET_NAME}
    public-url: ${R2_PUBLIC_URL}

---
spring:
  config:
    activate:
      on-profile: "prod"
  jpa:
    hibernate:
      ddl-auto: validate
