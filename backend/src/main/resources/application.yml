app:
  cors:
    # Production origins come from the environment; the defaults are dev only.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  cart:
    # Tax rates live in global_settings (taxRateJewelry, taxRateGemstones,
    # taxRateDefault), read by CartService; there is no tax-rate property.
    shipping-threshold: ${CART_SHIPPING_THRESHOLD:1000}
    standard-shipping-fee: ${CART_STANDARD_SHIPPING_FEE:50}
    gift-wrap-fee: ${CART_GIFT_WRAP_FEE:5}
  # Base URL of the storefront, used in password-reset emails (AuthService).
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

# Injected by PaymentService as ${razorpay.key_id} / ${razorpay.key_secret}.
# Both empty => payment endpoints fail closed with 503.
razorpay:
  key_id: ${RAZORPAY_KEY_ID:}
  key_secret: ${RAZORPAY_KEY_SECRET:}
  # Secret configured on the Razorpay dashboard for the webhook pointing at
  # POST /api/v1/payments/webhook. Empty => every webhook call answers 401.
  webhook_secret: ${RAZORPAY_WEBHOOK_SECRET:}

# ERP e-commerce integration (ErpSyncService). Invoices and refunds are
# queued in erp_sync_events and pushed to {base-url}/api/v1/integrations/
# ecommerce/*. Either value blank => events stay PENDING; nothing is sent.
erp:
  base-url: ${ERP_BASE_URL:}
  api-key: ${ERP_API_KEY:}

spring:
  application:
    name: jewelry-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 86400000 # 24 hours
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  health:
    mail:
      enabled: false
  endpoint:
    health:
      # /actuator/health is reachable unauthenticated for container probes, so
      # it must never disclose component detail.
      show-details: never
      show-components: never
  endpoints:
    web:
      exposure:
        include: health,info

goldapi:
  key: ${GOLDAPI_KEY}
  base-url: https://www.goldapi.io/api
  cache-minutes: 15

cloudflare:
  r2:
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    endpoint: ${R2_ENDPOINT}
    bucket: ${R2_BUCKET_NAME}
    public-url: ${R2_PUBLIC_URL}

---
spring:
  config:
    activate:
      on-profile: "prod"
  jpa:
    hibernate:
      # No migration tool (Flyway/Liquibase) exists in this project, so the schema is
      # managed by Hibernate in production as well. `validate` would refuse to start
      # on a fresh VM or after any release that adds a column; keep `update` until a
      # migration tool is introduced. Override with SPRING_JPA_HIBERNATE_DDL_AUTO.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
