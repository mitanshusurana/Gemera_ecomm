# LOCAL: every service built from source, one command.
# Usage: cp .env.local.example .env.local && edit && docker compose -f docker-compose.local.yml up --build
#
# Explicit project name: docker-compose.erp.yml lives in the same directory and
# would otherwise share the default project ("gemera_ecomm"), so each stack's
# `up` reported the other's containers as orphans and `down --remove-orphans`
# would have removed the other stack. Volumes are namespaced by this name too.
name: caratloop-local

services:
  postgres:
    image: postgres:15-alpine
    container_name: jewelry-postgres-local
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jewelry-backend-local
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # The dns: override above stops Docker's internal resolver from answering
    # host.docker.internal, which ERP_BASE_URL=http://host.docker.internal:8010
    # (the ERP stack published on the laptop) relies on. host-gateway restores it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Every backend variable, including the optional ERP_BASE_URL / ERP_API_KEY
    # for the ERP outbox, is read from this file (same keys as .env.backend.example).
    env_file:
      - .env.local
    # Host ports are overridable from .env.local (API_PORT, STOREFRONT_PORT,
    # ADMIN_PORT) so the stack can run beside another project that already
    # publishes 8080. Keep API_URL in .env.local in step with API_PORT.
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: jewelry-frontend-local
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "${STOREFRONT_PORT:-4200}:4000"
    depends_on:
      - backend

  admin:
    build:
      context: .
      dockerfile: admin.Dockerfile
    container_name: jewelry-admin-local
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "${ADMIN_PORT:-4300}:80"
    depends_on:
      - backend

volumes:
  postgres_data_local:
