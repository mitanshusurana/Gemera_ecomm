

# LOCAL DEV — All services running locally
# Usage: docker compose -f docker-compose.local.yml up --build

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jewelry-backend-local
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "8080:8080"


  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: jewelry-frontend-local
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "4200:4000"
    depends_on:
      - backend

  admin:
    build:
      context: .
      dockerfile: admin.Dockerfile
    container_name: jewelry-admin-local
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "4300:80"
    depends_on:
      - backend



